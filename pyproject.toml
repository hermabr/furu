[project]
name = "furu"
version = "0.0.67"
description = "Reproducible experiments in plain Python: cached results and dependency-aware execution."
readme = "README.md"
authors = [
    { name = "Herman Brunborg", email = "herman@brunborg.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "websockets>=16.0",
]

[project.urls]
Repository = "https://github.com/hermabr/furu"

[project.entry-points.pytest11]
furu = "furu.testing"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.10.0",
    "marimo>=0.23.5",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "DTZ001", "TRY004"]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
markers = [
    "slurm_integration: opt-in Docker-backed tests that run against a real local Slurm daemon",
]
